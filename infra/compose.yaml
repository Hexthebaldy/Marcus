name: marcus
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marcus
      MYSQL_USER: marcus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-marcus-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-marcus-root-local-only}
    ports: ["127.0.0.1:3307:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-marcus-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-marcus-local-storage-only}
    ports: ["9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  mysql-data:
  redis-data:
  media-data:
